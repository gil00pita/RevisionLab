name: Validate and publish npm package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize version selection through publication, including explicit releases.
concurrency:
  group: npm-${{ github.repository }}-${{ (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'publish' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Build, test, and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
      filename: ${{ steps.release.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Pin Yarn Classic
        run: npm install --global yarn@1.22.22 --ignore-scripts
      - name: Prepare release version
        id: prepare
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - name: Check release metadata
        id: release
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: yarn install --frozen-lockfile --non-interactive
      - run: npm run test:release
      - run: npm run lint
      - run: npm run build
      - run: npm run test:package
      - name: Pack the tested build
        run: |
          mkdir -p "$RUNNER_TEMP/revisionlab-package"
          npm run release:pack -- --ignore-scripts --pack-destination "$RUNNER_TEMP/revisionlab-package"
      - name: Smoke-test the exact packed CLI
        run: node scripts/verify-package.mjs "$RUNNER_TEMP/revisionlab-package/$PACKAGE_FILE"
        env:
          PACKAGE_FILE: ${{ steps.release.outputs.filename }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/revisionlab-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified tarball to npm
    if: >-
      needs.verify.outputs.publish == 'true' &&
      github.repository == 'gil00pita/RevisionLab' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/revisionlab-package
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/revisionlab-package/$PACKAGE_FILE" --access public --tag "$NPM_TAG" --ignore-scripts --registry=https://registry.npmjs.org/
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.filename }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
      - name: Report published package
        run: echo "Published [$PACKAGE_FILE](https://www.npmjs.com/package/revisionlab) to npm under $NPM_TAG." >> "$GITHUB_STEP_SUMMARY"
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.filename }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
