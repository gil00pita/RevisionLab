<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">RevisionLab screenshot placeholders</title>
  <desc id="description">Two empty panels reserved for real screenshots of the flow whiteboard and screen comments. No product interface is depicted.</desc>
  <rect x="1" y="1" width="1118" height="348" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <g fill="none" stroke="#64748b" stroke-dasharray="8 6">
    <rect x="28" y="28" width="520" height="294" rx="12"/>
    <rect x="572" y="28" width="520" height="294" rx="12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#334155">
    <text x="288" y="146" font-size="13" letter-spacing="2">SCREENSHOT 01</text>
    <text x="288" y="181" font-size="24" font-weight="700">The whole journey</text>
    <text x="288" y="212" font-size="16">Add the flow whiteboard here.</text>
    <text x="832" y="146" font-size="13" letter-spacing="2">SCREENSHOT 02</text>
    <text x="832" y="181" font-size="24" font-weight="700">The conversation</text>
    <text x="832" y="212" font-size="16">Add screen comments and replies here.</text>
  </g>
</svg>
